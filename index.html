<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>Weekly Progress</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1c2230;--muted:#5d6676;--line:#d9dde4;--accent:#3b5bdb;--accent-soft:#e8edff;
--red:#c92a2a;--red-soft:#ffe9e9;--green:#2b8a3e;--green-soft:#e6f6ea;--grey-soft:#eef0f3;--focus:#3b5bdb55;--on-accent:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12151b;--card:#1b1f27;--ink:#e7eaf0;--muted:#9aa3b2;--line:#323946;
--accent:#91a7ff;--accent-soft:#232c48;--red:#ff8787;--red-soft:#3a1f22;--green:#8ce99a;--green-soft:#1d3324;--grey-soft:#262b35;--focus:#91a7ff55;--on-accent:#12151b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:24px 16px 120px}
h1{font-size:24px;margin:0 0 4px}h2{font-size:19px;margin:28px 0 10px}h3{font-size:16px;margin:0}
.lede{color:var(--muted);margin:0 0 20px;font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media (max-width:560px){.row{grid-template-columns:1fr}}
label,.lbl{display:block;font-weight:600;font-size:14px;margin:14px 0 5px}
.row>div>label:first-child,.card>label:first-child{margin-top:0}
label .opt{font-weight:400;color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin:-2px 0 6px}
#week-note{margin:6px 0 0}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
input[type=date]{min-height:44px}
textarea{resize:vertical;min-height:44px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--focus)}
.invalid{border-color:var(--red)!important}
.money{position:relative}.money span{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}.money input{padding-left:24px}
.bullet{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px}.bullet b{color:var(--muted);padding-top:9px;width:12px}
.seg{display:flex;gap:8px}.seg label{flex:1;margin:0;font-weight:500;border:1px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer;display:flex;gap:8px;align-items:center}
.seg input{width:auto;margin:0}.seg label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.seg.invalid label{border-color:var(--red)}
.proj-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.proj-head h3{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.04em}
.remove{background:none;border:0;color:var(--muted);font:inherit;font-size:14px;cursor:pointer;padding:4px 6px}
.remove:hover{color:var(--red)}
.card-err{color:var(--red);font-size:14px;margin-top:10px}
.add{width:100%;font:inherit;font-weight:600;padding:12px;border:1.5px dashed var(--line);border-radius:12px;background:none;color:var(--accent);cursor:pointer}
.add:hover{border-color:var(--accent)}
.note{background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.instructions{background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-size:14px;white-space:pre-line;margin-bottom:8px}
.preview{margin-top:8px;max-width:100%;max-height:220px;border:1px solid var(--line);border-radius:8px;display:none}
.sendbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px}
.sendbar .in{max-width:720px;margin:0 auto;display:flex;gap:12px;align-items:center}
.sendbar .msg{flex:1;font-size:14px;color:var(--muted);min-width:0}
.sendbar .msg.err{color:var(--red)}.sendbar .msg.ok{color:var(--green)}
button.primary{font:inherit;font-weight:600;padding:12px 22px;border-radius:8px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);white-space:nowrap}
button:disabled{opacity:.6;cursor:default}
.done{text-align:center;padding:28px 18px}
.done .big{font-size:40px;line-height:1;color:var(--green)}
.done ul{text-align:left;display:inline-block;margin:10px 0 0;padding-left:20px;font-size:15px}
.banner{background:var(--red-soft);color:var(--red);padding:10px 12px;border-radius:8px;font-size:14px;margin-bottom:16px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <h1>Weekly Progress</h1>
  <p class="lede">Your weekly check-in: the projects you worked on, plus your Claude usage, sent together in one go. About 5 minutes.</p>
  <div id="banner" class="banner" hidden></div>

  <div class="card">
    <div class="row">
      <div><label for="name">Name</label><select id="name"><option value="">Choose your name</option></select></div>
      <div><label for="week">Week ending (Friday)</label><input type="date" id="week" step="7"><p class="hint" id="week-note" hidden></p></div>
    </div>
  </div>

  <div id="done" class="card done" hidden></div>

  <form id="form" novalidate hidden>
    <div id="state" class="note" hidden></div>

    <h2>Projects</h2>
    <div id="projects"></div>
    <button type="button" class="add" id="add">+ Add another project</button>

    <h2>Claude usage</h2>
    <div class="card" id="usage">
      <div class="row">
        <div><label for="spend">Spend used so far this month</label><div class="money"><span>$</span><input id="spend" inputmode="decimal" placeholder="0.00"></div></div>
        <div><label for="budget">Current monthly budget</label><div class="money"><span>$</span><input id="budget" inputmode="decimal" placeholder="0.00"></div></div>
      </div>
      <span class="lbl">Did you request a budget increase this week?</span>
      <div class="seg" id="inc-seg"><label><input type="radio" name="inc" value="no"> No</label><label><input type="radio" name="inc" value="yes"> Yes</label></div>
      <div id="inc-wrap" hidden>
        <div class="row">
          <div><label for="inc-amount">New budget requested</label><div class="money"><span>$</span><input id="inc-amount" inputmode="decimal"></div></div>
          <div><label for="inc-status">Request status</label><select id="inc-status"></select></div>
        </div>
        <label for="inc-reason">Reason for the increase</label><input id="inc-reason" maxlength="300">
      </div>
      <label for="shot">Usage screenshot</label>
      <div class="instructions" id="shot-howto"></div>
      <input type="file" id="shot" accept="image/*">
      <p class="hint" id="shot-state"></p>
      <img class="preview" id="shot-preview" alt="Screenshot preview">
      <div class="card-err" id="usage-err" hidden></div>
    </div>
  </form>
</div>

<div class="sendbar" id="sendbar" hidden><div class="in">
  <div class="msg" id="msg"></div>
  <button class="primary" id="send" type="submit" form="form">Send weekly update</button>
</div></div>

<script>
const $ = id => document.getElementById(id);
let CFG = null, MINE = null, shotData = null, cardSeq = 0, lastWeek = null;

// ---- helpers ----
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const day = s => new Date(s + 'T12:00');
// The Friday a date belongs to: that week's Friday Mon–Fri, the one just past on a weekend.
function fridayFor(d) {
  d = new Date(d); d.setHours(12, 0, 0, 0);
  const wd = d.getDay();
  d.setDate(d.getDate() + (wd === 6 ? -1 : wd === 0 ? -2 : 5 - wd));
  return d;
}
const fmtWeek = s => day(s).toLocaleDateString(undefined, {weekday: 'short', month: 'short', day: 'numeric'});
function store(k, v) { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) {} }
function recall(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const money = n => '$' + Number(n).toLocaleString(undefined, {minimumFractionDigits: Number(n) % 1 ? 2 : 0, maximumFractionDigits: 2});
const num = v => { const n = parseFloat(String(v).replace(/[$,\s]/g, '')); return isNaN(n) ? null : n; };
const options = (items, first) => (first ? `<option value="">${first}</option>` : '') +
  items.map(i => typeof i === 'string' ? `<option>${esc(i)}</option>` : `<option value="${esc(i.value)}">${esc(i.label)}</option>`).join('');
function msg(text, kind) { $('msg').textContent = text; $('msg').className = 'msg ' + (kind || ''); }

async function api(path, opts = {}) {
  const r = await fetch(path, {headers: {'Content-Type': 'application/json'}, ...opts});
  let body = {};
  try { body = await r.json(); } catch (e) {}
  if (!r.ok) { const e = new Error(body.error || `The server said ${r.status}.`); e.body = body; throw e; }
  return body;
}

// ---- week: a date picker that only lands on Fridays ----
// min is a Friday and step is 7, so Chrome greys out every other day; any
// browser that lets another day through gets moved to that week's Friday.
function setupWeek() {
  const f = fridayFor(new Date()), lo = new Date(f), hi = new Date(f);
  lo.setDate(f.getDate() - 7 * 52); hi.setDate(f.getDate() + 7);
  Object.assign($('week'), {min: iso(lo), max: iso(hi), value: iso(f)});
  lastWeek = iso(f);
  $('week').onchange = () => {
    const w = $('week'), note = $('week-note');
    if (!w.value) { w.value = lastWeek; return; }
    if (w.value === lastWeek) return;     // same week again: keep any note showing
    note.hidden = true;
    let fri = iso(fridayFor(day(w.value)));
    if (fri < w.min) fri = w.min;
    if (fri > w.max) fri = w.max;
    if (fri !== w.value) { note.textContent = `Weeks end on Friday, so this is the week ending ${fmtWeek(fri)}.`; note.hidden = false; w.value = fri; }
    if (w.value !== lastWeek) { lastWeek = w.value; load(); }
  };
}

// ---- setup ----
async function init() {
  setupWeek();
  try { CFG = await api('/api/config'); }
  catch (e) { $('banner').textContent = 'Couldn\'t load the form: ' + e.message; $('banner').hidden = false; return; }
  if (!CFG.writable) { $('banner').textContent = 'The server can\'t save right now. Sending will fail until an admin fixes its storage.'; $('banner').hidden = false; }
  $('name').innerHTML = options(CFG.roster, 'Choose your name');
  const me = recall('wp-name');
  if (me && CFG.roster.includes(me)) $('name').value = me;
  $('inc-status').innerHTML = options(CFG.requestStatuses, 'Choose');
  $('shot-howto').textContent = CFG.screenshotInstructions || 'Capture your Claude usage screen for this month so far.';

  $('name').onchange = () => { store('wp-name', $('name').value); load(); };
  $('add').onclick = () => { const c = addCard(); c.querySelector('select, input').focus(); };
  document.querySelectorAll('input[name=inc]').forEach(r => r.onchange = () => { $('inc-wrap').hidden = incValue() !== true; });
  $('shot').onchange = onShot;
  $('form').onsubmit = send;
  $('form').addEventListener('input', () => { if ($('msg').classList.contains('err')) msg(''); });
  load();
}

// ---- load what this person has for the week ----
async function load() {
  $('done').hidden = true;
  const name = $('name').value, week = $('week').value;
  $('form').hidden = $('sendbar').hidden = !name;
  if (!name) return;
  msg('');
  try { MINE = await api(`/api/mine?name=${encodeURIComponent(name)}&week=${week}`); }
  catch (e) { msg(e.message, 'err'); return; }
  $('projects').innerHTML = ''; cardSeq = 0;
  const st = $('state');
  if (MINE.updates.length) {
    MINE.updates.forEach(u => addCard(u));
    st.textContent = `You sent this week's update on ${new Date(MINE.usage?.updatedAt || MINE.updates[0].updatedAt).toLocaleString()}. Change anything and send again. Removing a project here removes it from your update.`;
    st.hidden = false;
  } else {
    const carry = MINE.lastProjects.filter(u => u.status !== 'Completed');
    carry.forEach(u => addCard({project: u.project, type: u.type, status: u.status}));
    if (!carry.length) addCard();
    st.textContent = carry.length ? `Started from your projects for the week ending ${fmtWeek(MINE.lastWeek)}. Update each one, and remove any you didn't work on this week.` : '';
    st.hidden = !carry.length;
  }
  fillUsage();
  $('send').textContent = MINE.updates.length || MINE.usage ? 'Send updated version' : 'Send weekly update';
}

// ---- project cards ----
function addCard(u = {}) {
  const id = ++cardSeq, el = document.createElement('div');
  el.className = 'card proj';
  const known = !u.project || CFG.projects.some(p => p.name.toLowerCase() === u.project.toLowerCase());
  const learned = CFG.projects.length > 0;
  el.innerHTML = `
    <div class="proj-head"><h3>Project</h3><button type="button" class="remove">Remove</button></div>
    <div class="pick"${learned ? '' : ' hidden'}><label for="p${id}">Project</label>
      <select id="p${id}" class="f-pick">${options([...CFG.projects.map(p => p.name), {value: '__new', label: 'New project…'}], 'Choose a project')}</select></div>
    <div class="newname"${learned ? ' hidden' : ''}><label for="n${id}">${learned ? 'New project name' : 'Project name'}</label>
      <p class="hint">Keep it short and use the same name every week, so the report can follow it.</p>
      <input id="n${id}" class="f-new" maxlength="120" placeholder="e.g. Commission Audit Tool"></div>
    <div class="row">
      <div><label for="t${id}">Project type</label><select id="t${id}" class="f-type">${options([{value: 'Claude', label: 'Claude project'}, {value: 'Non-Claude', label: 'Non-Claude project'}], 'Choose')}</select></div>
      <div><label for="s${id}">Status</label><select id="s${id}" class="f-status">${options(CFG.statuses, 'Choose')}</select></div>
    </div>
    <span class="lbl">Progress and next steps</span>
    <p class="hint">One to three short bullets: what moved this week and what's next.</p>
    ${[0, 1, 2].map(i => `<div class="bullet"><b>•</b><textarea class="f-b" rows="2" maxlength="500"${i ? ' placeholder="Optional"' : ''} aria-label="Bullet ${i + 1}"></textarea></div>`).join('')}
    <div class="saved" hidden><label for="h${id}">Time saved with Claude this week</label><select id="h${id}" class="f-saved">${options(CFG.timeSaved, 'Choose')}</select></div>
    <div class="help" hidden><label for="c${id}">Anything Claude could have helped with? <span class="opt">(optional)</span></label>
      <input id="c${id}" class="f-help" maxlength="300" placeholder="A step that could have been faster with Claude"></div>
    <div class="card-err" hidden></div>`;
  const q = s => el.querySelector(s);
  if (u.project) {
    if (known) q('.f-pick').value = CFG.projects.find(p => p.name.toLowerCase() === u.project.toLowerCase()).name;
    else { q('.f-pick').value = '__new'; q('.f-new').value = u.project; }
  }
  q('.f-type').value = u.type || '';
  q('.f-status').value = u.status || '';
  el.querySelectorAll('.f-b').forEach((t, i) => t.value = (u.progress || [])[i] || '');
  q('.f-saved').value = u.timeSaved || '';
  q('.f-help').value = u.couldHelp || '';
  const sync = () => {
    q('.newname').hidden = learned && q('.f-pick').value !== '__new';
    q('.saved').hidden = q('.f-type').value !== 'Claude';
    q('.help').hidden = q('.f-type').value !== 'Non-Claude';
  };
  q('.f-pick').onchange = () => {
    const p = CFG.projects.find(p => p.name === q('.f-pick').value);
    if (p && p.type) q('.f-type').value = p.type;
    sync();
  };
  q('.f-type').onchange = sync;
  q('.remove').onclick = () => { el.remove(); renumber(); };
  const clear = () => { el.querySelectorAll('.invalid').forEach(x => x.classList.remove('invalid')); q('.card-err').hidden = true; };
  el.addEventListener('input', clear);
  el.addEventListener('change', clear);
  sync();
  $('projects').append(el);
  renumber();
  return el;
}
function renumber() {
  const cards = [...document.querySelectorAll('.proj')];
  cards.forEach((c, i) => { c.querySelector('h3').textContent = `Project ${i + 1}`; c.querySelector('.remove').hidden = cards.length === 1; });
}
function readCard(el) {
  const q = s => el.querySelector(s);
  const isNew = !CFG.projects.length || q('.f-pick').value === '__new';
  return {
    project: (isNew ? q('.f-new').value : q('.f-pick').value).trim(),
    type: q('.f-type').value, status: q('.f-status').value,
    progress: [...el.querySelectorAll('.f-b')].map(t => t.value.trim()).filter(Boolean),
    timeSaved: q('.f-saved').value, couldHelp: q('.f-help').value.trim(),
  };
}
function checkCard(el, d) {   // the server's rules, checked here to point at the field
  const q = s => el.querySelector(s), bad = [];
  const isNew = !CFG.projects.length || q('.f-pick').value === '__new';
  if (!d.project) bad.push([isNew ? q('.f-new') : q('.f-pick'), 'Choose or name the project.']);
  if (!d.type) bad.push([q('.f-type'), 'Choose the project type.']);
  if (!d.status) bad.push([q('.f-status'), 'Choose a status.']);
  if (!d.progress.length) bad.push([q('.f-b'), 'Add at least one line of progress.']);
  if (d.type === 'Claude' && !d.timeSaved) bad.push([q('.f-saved'), 'Choose how much time Claude saved.']);
  return bad;
}
function cardError(el, text, fields = []) {
  fields.forEach(f => f.classList.add('invalid'));
  const e = el.querySelector('.card-err'); e.textContent = text; e.hidden = !text;
}

// ---- usage ----
function incValue() { const r = document.querySelector('input[name=inc]:checked'); return r ? r.value === 'yes' : null; }
function clearUsage() { document.querySelectorAll('#usage .invalid').forEach(x => x.classList.remove('invalid')); $('usage-err').hidden = true; }
$('usage').addEventListener('input', clearUsage);
$('usage').addEventListener('change', clearUsage);
function fillUsage() {
  const u = MINE.usage;
  shotData = null; $('shot').value = ''; $('shot-preview').style.display = 'none';
  $('spend').value = u ? u.spend : '';
  $('budget').value = u ? u.budget : (MINE.lastBudget ?? '');
  document.querySelectorAll('input[name=inc]').forEach(r => r.checked = u ? (r.value === 'yes') === u.increaseRequested : false);
  $('inc-wrap').hidden = !(u && u.increaseRequested);
  $('inc-amount').value = u?.increase?.amount ?? '';
  $('inc-status').value = u?.increase?.status ?? '';
  $('inc-reason').value = u?.increase?.reason ?? '';
  $('shot-state').textContent = u ? 'Your screenshot is on file. Upload a new one only to replace it.' : '';
  clearUsage();
}
function checkUsage() {
  const bad = [], inc = incValue();
  if (num($('spend').value) === null) bad.push([$('spend'), 'Enter your spend so far this month.']);
  if (!(num($('budget').value) > 0)) bad.push([$('budget'), 'Enter your monthly budget.']);
  if (inc === null) bad.push([$('inc-seg'), 'Say whether you asked for a budget increase.']);
  if (inc) {
    if (!(num($('inc-amount').value) > 0)) bad.push([$('inc-amount'), 'Enter the budget you asked for.']);
    if (!$('inc-status').value) bad.push([$('inc-status'), 'Choose the request status.']);
    if (!$('inc-reason').value.trim()) bad.push([$('inc-reason'), 'Give the reason for the increase.']);
  }
  if (!shotData && !MINE.usage) bad.push([$('shot'), 'Attach your usage screenshot.']);
  return bad;
}

// Big screenshots are shrunk to a 2000px-wide JPEG before sending.
async function onShot() {
  shotData = null;
  const f = $('shot').files[0];
  if (!f) return;
  try {
    const url = await new Promise((ok, bad) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = () => bad(r.error); r.readAsDataURL(f); });
    const img = await new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => bad(new Error('That file isn\'t an image this browser can read.')); i.src = url; });
    if (/^data:image\/(png|jpeg|webp);/.test(url) && f.size <= 1.5e6 && img.naturalWidth <= 2400) shotData = url;
    else {
      const scale = Math.min(1, 2000 / img.naturalWidth), c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * scale); c.height = Math.round(img.naturalHeight * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      shotData = c.toDataURL('image/jpeg', 0.88);
    }
    $('shot-preview').src = shotData; $('shot-preview').style.display = 'block';
  } catch (e) { $('shot').value = ''; $('usage-err').textContent = e.message; $('usage-err').hidden = false; }
}

// ---- send everything ----
async function send(ev) {
  ev.preventDefault();
  const cards = [...document.querySelectorAll('.proj')];
  // a blank extra card is skipped rather than blocking the send
  const used = cards.filter(c => { const d = readCard(c); return cards.length === 1 || d.project || d.progress.length || d.status; });
  let firstBad = null;
  used.forEach(c => {
    const bad = checkCard(c, readCard(c));
    cardError(c, bad.map(b => b[1]).join(' '), bad.map(b => b[0]));
    if (bad.length && !firstBad) firstBad = c;
  });
  const names = used.map(c => readCard(c).project.toLowerCase());
  used.forEach((c, i) => { if (names[i] && names.indexOf(names[i]) !== i) { cardError(c, 'This project is already listed above. Combine them into one.'); firstBad = firstBad || c; } });
  const ub = checkUsage();
  ub.forEach(b => b[0].classList.add('invalid'));
  $('usage-err').textContent = ub.map(b => b[1]).join(' '); $('usage-err').hidden = !ub.length;
  if (ub.length && !firstBad) firstBad = $('usage');
  if (firstBad) { msg('A few things need fixing. They\'re marked in red.', 'err'); firstBad.scrollIntoView({behavior: 'smooth', block: 'center'}); return; }

  const inc = incValue();
  const body = {
    name: $('name').value, week: $('week').value, projects: used.map(readCard),
    usage: {spend: num($('spend').value), budget: num($('budget').value), increaseRequested: inc,
            increase: inc ? {amount: num($('inc-amount').value), reason: $('inc-reason').value.trim(), status: $('inc-status').value} : null,
            screenshot: shotData},
  };
  const btn = $('send'); btn.disabled = true; msg('Sending…');
  try {
    const r = await api('/api/submit', {method: 'POST', body: JSON.stringify(body)});
    try { CFG.projects = (await api('/api/config')).projects; } catch (e) {}
    showDone(r);
  } catch (e) {
    (e.body?.errors || []).forEach(x => {
      if (x.usage) { $('usage-err').textContent = x.error; $('usage-err').hidden = false; }
      else if (x.project != null && used[x.project]) cardError(used[x.project], x.error);
    });
    msg(e.message, 'err');
  }
  btn.disabled = false;
}

function showDone(r) {
  const u = r.usage, pct = u.budget ? Math.round(100 * u.spend / u.budget) : 0;
  $('done').innerHTML = `<div class="big">✓</div><h2 style="margin:10px 0 4px">${r.resent ? 'Update re-sent' : 'Sent'}. Thanks, ${esc($('name').value.split(' ')[0])}!</h2>
    <p class="hint" style="margin:0">Week ending ${esc(fmtWeek($('week').value))}. You've used ${pct}% of your ${money(u.budget)} budget this month.</p>
    <ul>${r.updates.map(x => `<li><strong>${esc(x.project)}</strong>: ${esc(x.status)}</li>`).join('')}</ul>
    <p style="margin:18px 0 0"><button type="button" class="primary" id="edit">Make a change</button></p>`;
  $('done').hidden = false; $('form').hidden = $('sendbar').hidden = true;
  $('edit').onclick = load;
  scrollTo({top: 0, behavior: 'smooth'});
}

init();
</script>
</body>
</html>
